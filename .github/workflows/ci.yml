name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/ploos-domains
      - name: Build container image
        run: docker build -t ploos-domains:ci .
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ploos
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ploos_domains_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ploos -d ploos_domains_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ploos
      PGPASSWORD: test-only-password
      PGDATABASE: ploos_domains_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply initial schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000001_initial.up.sql
      - name: Verify database constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000001_constraints.sql
      - name: Apply subdomain schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000002_subdomains.up.sql
      - name: Verify subdomain constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000002_subdomains.sql
      - name: Apply verification schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000003_domain_verification.up.sql
      - name: Verify challenge persistence schema
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000003_verification.sql
      - name: Apply OIDC identity schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000004_oidc_identities.up.sql
      - name: Verify OIDC identity isolation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000004_oidc_identities.sql
      - name: Apply invitation schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000005_enrollment_invitations.up.sql
      - name: Verify invitation constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000005_enrollment.sql
      - name: Apply audit event schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000006_audit_events.up.sql
      - name: Verify audit event constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000006_audit_events.sql
      - name: Configure least-privilege audit roles
        run: psql -v ON_ERROR_STOP=1 -f db/security/audit_roles.sql
      - name: Verify audit role privileges
        run: psql -v ON_ERROR_STOP=1 -f db/security/test_audit_roles.sql
      - name: Verify audit API least-privilege role
        run: psql -v ON_ERROR_STOP=1 -f db/security/test_audit_api_role.sql
      - name: Apply domain portfolio schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000007_domain_portfolio.up.sql
      - name: Apply browser session schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000008_browser_sessions.up.sql
      - name: Apply OIDC login transaction schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000009_oidc_login_transactions.up.sql
      - name: Verify restricted browser OIDC database role
        run: psql -v ON_ERROR_STOP=1 -f db/security/test_browser_oidc_role.sql
      - name: Provision disposable restricted browser OIDC role
        run: psql -v ON_ERROR_STOP=1 -f db/security/setup_browser_oidc_ci_role.sql
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod tidy
      - name: Go PostgreSQL integration tests
        env:
          PLOOS_TEST_DATABASE_URL: postgres://ploos:test-only-password@localhost:5432/ploos_domains_test?sslmode=disable
        run: go test -mod=mod -race -tags=integration -count=1 ./internal/verification ./internal/auth ./internal/server
      - name: Go browser OIDC restricted-role integration test
        env:
          PLOOS_TEST_DATABASE_URL: postgres://ploos:test-only-password@localhost:5432/ploos_domains_test?sslmode=disable
          PLOOS_TEST_BROWSER_OIDC_DATABASE_URL: postgres://ploos_browser_oidc_runtime_ci:browser-oidc-ci-only-password@localhost:5432/ploos_domains_test?sslmode=disable
        run: go test -mod=mod -race -tags=integration -count=1 ./cmd/ploos-domains
