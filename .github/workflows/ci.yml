name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OIDC identity schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000004_oidc_identities.up.sql
      - name: Verify OIDC identity isolation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000004_oidc_identities.sql
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/ploos-domains
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ploos
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ploos_domains_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ploos -d ploos_domains_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ploos
      PGPASSWORD: test-only-password
      PGDATABASE: ploos_domains_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply initial schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000001_initial.up.sql
      - name: Verify database constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000001_constraints.sql
      - name: Apply subdomain schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000002_subdomains.up.sql
      - name: Verify subdomain constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000002_subdomains.sql
      - name: Apply verification schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/000003_domain_verification.up.sql
      - name: Verify challenge persistence schema
        run: psql -v ON_ERROR_STOP=1 -f db/tests/000003_verification.sql
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod tidy
      - name: Go PostgreSQL integration tests
        env:
          PLOOS_TEST_DATABASE_URL: postgres://ploos:test-only-password@localhost:5432/ploos_domains_test?sslmode=disable
        run: go test -mod=mod -race -tags=integration -count=1 ./internal/verification
